changelog: >
  Caps how much Scryer discovery the Android TV channel publishes, because Scryer's
  discovery query takes no size arguments and Jellyfin stores every published rail
  and title as a library row and a downloaded poster for each user. Rails and titles
  per rail are now configurable, defaulting to 8 and 20. Stops a guidance stub such
  as "Connect Scryer in Jellyfin Web" outliving the moment it described: the channel
  cache key now tracks whether the user has a stored Scryer grant, so connecting
  clears the card at once, and cleanup removes stale stubs even with the channel on.
