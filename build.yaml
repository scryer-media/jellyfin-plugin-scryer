changelog: >
  Stops the Android TV channel from crashing the Jellyfin server and from going empty.
  Opening a guidance card such as "Scryer Discovery unavailable" made the channel answer
  the card's own folder query with the card again; Jellyfin 10.11 then stored the row as
  its own parent and recursed through that parent chain until the whole server process
  died of a stack overflow. Guidance cards now answer only the root query, and nothing is
  ever listed as a child of itself. Separately, Jellyfin caches every channel response for
  three hours and lists library rows on a cache hit, so a cached card whose row the
  cleanup sweep had removed rendered as an empty channel. The cache key now rolls every
  five minutes while a guidance card is the latest thing published, the sweep clears the
  channel's response cache whenever it removes rows, and the data version is bumped so
  responses cached by earlier versions are bypassed. Discovery is also resized: up to
  twenty "More like ..." rails of five titles each, built from that user's most recently
  watched titles, come first, followed by Scryer's sections, under a new configurable
  total of 200 titles per user that bounds what Jellyfin stores.
