changelog: >
  Fixes the Favorite heart on an Android TV title failing with "This title has no supported
  external identifier." Scryer's item detail carries every id it knows for a title, often
  more than sixteen across providers and kinds, and the plugin rejected the whole detail
  when there were more than sixteen, when any single id was unreadable, when the year was
  unknown, or when the overview was long. Ids are now read individually, an unreadable one
  is skipped, an unknown year is sent as unknown, and a long overview is trimmed, so the add
  or request goes through with the ids Scryer actually returned.
