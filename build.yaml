changelog: >
  Fixes two Android TV Favorite problems traced on a live server. Hearting a title from a
  "More like..." rail could fail with "This title has no supported external identifier."
  because those rails come from Scryer's title graph and the title is not always in its
  discovery store, so the detail lookup the action relied on returned nothing. Rows now
  carry the external ids Scryer matched them on, and the action falls back to them, plus
  the id in the row's own key, when there is no detail. Separately, an anime recommended
  as a plain series was added to the series library; the library is now chosen by Scryer's
  content type, so anime goes to the anime library. Channel rows are republished under a
  new data version so existing rows pick up both changes.
