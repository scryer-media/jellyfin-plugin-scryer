changelog: >
  Makes the Android TV channel tolerate odd rows in Scryer's discovery data and say what it
  could not read. The channel still showed "Scryer Discovery unavailable" on the first
  request after 0.1.19.0 loaded, before any quota could have been spent, so the response
  parsing was rejecting real data: one item without a readable title, year, or poster, or
  one section it could not read, failed the whole projection with a bare invalid_response.
  An unreadable item or section is now left out, an unreadable year or poster is dropped
  from an otherwise good item, and only a missing section list or an unreadable batch is a
  failure. Every remaining failure names the check that tripped, and the channel writes
  that detail next to the code in its warning so the log says why the card was published.
