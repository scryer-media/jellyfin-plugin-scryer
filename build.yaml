changelog: >
  Fixes the Android TV channel showing "Scryer Discovery unavailable" for users with a
  watch history. The "More like ..." lookups went to Scryer as one GraphQL operation per
  watched title per id namespace, up to 160 in one batch. Scryer meters every operation in
  a batch against the caller's API quota (300 per minute per address) and rejects the whole
  batch with a single error object once it is spent, which the plugin read as an unreadable
  response. Lookups are now grouped into one operation per id namespace carrying every
  title's ids (at most thirteen operations for twenty titles), any larger batch is sent in
  consecutive requests of at most fifty operations, and a batch Scryer rejects is reported
  as the rate limit or authorization failure it is, so the channel retries a few minutes
  later instead of caching a blank card.
