changelog: >
  Logs why the Android TV channel published a guidance card. The channel previously
  showed "Scryer Discovery unavailable" while writing nothing to the Jellyfin log, so
  an administrator had a card on a television and no record to reconcile it against,
  and no way to tell an unreachable Scryer from a stale authorization. The Scryer
  failure code, such as scryer_offline or authorization_expired, is now recorded at
  warning level, while a user who has simply not linked an account yet is recorded at
  debug so warning level keeps carrying real faults.
